[project]
name = "assay"
version = "0.1.0"
description = "数采场示范数据的自动质检"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.0", "h5py>=3.11", "pyarrow>=17", "av>=13"]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.30"]

[project.scripts]
assay = "assay.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "space"]
