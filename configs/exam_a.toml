# 考卷 A 用的公开数据集。一个数据集只属于一个切分；授权照抄数据卡。
# camera 是给视频评判用的那一路（俯视或侧视，看得到整个工作台）。
# 开发集定阈值；测试集换了任务（分拣、乐高块）、换了机型（SO-101、双臂），只跑一次。
# 双臂开发集只有关节数据，不写 camera，也不进换描述考卷（2026-10-03 加）。
[[dataset]]
repo = "lerobot/svla_so100_pickplace"   # 50 条，把方块放进盒子
split = "dev"
license = "apache-2.0"
camera = "observation.images.top"

[[dataset]]
repo = "lerobot/svla_so100_stacking"    # 56 条，红块叠到蓝块上
split = "dev"
license = "apache-2.0"
camera = "observation.images.top"

[[dataset]]
repo = "jun-seo/bimanual_tilt"           # 60 条，双臂 SO-101 倒水；修「没做完」用的双臂开发集
split = "dev"
license = "apache-2.0"

[[dataset]]
repo = "armnet/armnetbench_v01_lerobot_bimanual_so101"  # 双臂 SO-101，4 个任务 1,219 条；叠毛巾和测试集同任务，不用
split = "dev"
license = "apache-2.0"
exclude_tasks = ["Fold the brown tea towel"]

[[dataset]]
repo = "lerobot/svla_so100_sorting"     # 52 条，红蓝块分进左右两个盒子
split = "test"
license = "apache-2.0"
camera = "observation.images.top"

[[dataset]]
repo = "lerobot/svla_so101_pickplace"   # 50 条，乐高块放进透明盒；robot_type 写的是 so100_follower
split = "test"
license = "apache-2.0"
camera = "observation.images.up"

[[dataset]]
repo = "CoRL2026-CSI/SO101-DualArm-teleop_fold_towel_100epi"  # 100 条，双臂叠毛巾
split = "test"
license = "apache-2.0"
camera = "observation.images.left_top"
